<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Criar Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <form action="login.html" method="post">

            <h2>Criar Usuário</h2>
            <div class="nomeUsuario"><label>Usuário</label><br>
                <input type="text" id="cadUsuario" placeholder="Mínimo 4 caracteres">
            </div>
            <div class="nomeEmail"> <label>Seu Email</label><br>
                <input type="email" id="cadEmail" placeholder="Escreva o Email">
            </div>
            <div class="senhaUsuario"><label>Senha do Usuário</label><br>
                <input type="password" id="cadSenha" placeholder="Mínimo de 6 caracteres">
            </div>
            <div class="ConfirmarSenha"><label>Confirmar sua senha</label><br>
                <input type="password" id="cadConfirma" placeholder="Repita sua senha">
            </div>
            <div class="checkbox"><label><input type="checkbox">Lembrar sua senha?</label>
            </div>
            <button class="Bcadastro" type="submit">Cadastrar Usuário</button><br>

            <p>Já tem conta? <br><button  type="button">Voltar ao login</button></p>
    </div>
    </form>
</body>

</html>
