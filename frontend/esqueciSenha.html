<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha · AgendaSH</title>
    <meta name="description" content="AgendaSH — agendamento interno de reuniões da Software House (UNDB).">
    <meta name="theme-color" content="#0b0a2a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-badge.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <div class="logo"><img src="img/logo-sh.webp" alt="Software House UNDB" width="520" height="511"><h1>AgendaSH</h1><span>Software House</span></div>
    <!-- Etapa 1: pedir o código por e-mail -->
    <form id="formEsqueci" style="margin-top:30px" novalidate>
        <div class="campo ico ico-email"><label for="recEmail">Email</label><input type="email" id="recEmail" autocomplete="email" required></div>
        <button class="btn" type="submit">Enviar código</button>
    </form>
    <!-- Etapa 2: digitar o código recebido e definir a nova senha -->
    <form id="formRecuperar" style="margin-top:30px;display:none" novalidate>
        <div class="campo ico ico-cod"><label for="recCodigo">Código recebido por e-mail</label><input type="text" id="recCodigo" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6 dígitos" required></div>
        <div class="campo ico ico-senha"><label for="recSenha">Senha nova</label><input type="password" id="recSenha" autocomplete="new-password" required></div>
        <div class="campo ico ico-senha"><label for="recConfirma">Confirmar senha</label><input type="password" id="recConfirma" autocomplete="new-password" required></div>
        <button class="btn" type="submit">Salvar senha</button>
        <a class="link" href="#" id="linkReenviar">Reenviar código</a>
    </form>
    <p id="msgErro" class="msg"></p>
    <a class="link" href="login.html">Voltar ao login</a>
</main>
<script src="src/core/api.js"></script>
<script src="src/modules/auth/services/auth.js"></script>
<script src="src/shared/cookies.js"></script>
<script src="src/shared/efeitos.js" defer></script>
</body>
</html>
