<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha · AgendaSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <div class="logo"><img src="BOTTOM_SH.png" alt="" onerror="this.style.display='none'"><h1>Adendy</h1><span>Softwere house</span></div>
    <!-- Etapa 1: pedir o link por e-mail -->
    <form id="formEsqueci" style="margin-top:30px" novalidate>
        <div class="campo"><label for="recEmail">Email</label><input type="email" id="recEmail" autocomplete="email" required></div>
        <button class="btn" type="submit">Enviar link</button>
    </form>
    <!-- Etapa 2: abre pelo link do e-mail (?token=...) e define a nova senha -->
    <form id="formRecuperar" style="margin-top:30px;display:none" novalidate>
        <div class="campo"><label for="recSenha">Senha nova</label><input type="password" id="recSenha" autocomplete="new-password" required></div>
        <div class="campo"><label for="recConfirma">Confirmar senha</label><input type="password" id="recConfirma" autocomplete="new-password" required></div>
        <button class="btn" type="submit">Salvar senha</button>
    </form>
    <p id="msgErro" class="msg"></p>
    <a class="link" href="login.html">Voltar ao login</a>
</main>
<script src="src/core/api.js"></script>
<script src="src/modules/auth/services/auth.js"></script>
</body>
</html>
