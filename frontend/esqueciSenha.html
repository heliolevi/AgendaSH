<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Esqueci minha senha</title>
</head>

<body>
    <form action="cadastro.html" method="get" class="formEsqueciSenha">
        <h2>Esqueci minha Senha </h2>
        <label for="Email">Digite o Email cadastrado</label><br>
        <input type="email" placeholder="Digite o Email"><br>
        <label>Digite sua nova senha</label><br>
        <input type="password" id="nvSenha" placeholder="Nova senha"><br>
        <label>Confirme a senha</label><br>
        <input type="password" id="confirmNvsenha" placeholder=" Repita a nova senha"><br>
        <button>Atualizar a nova senha</button>
    </form>
</body>

</html>
