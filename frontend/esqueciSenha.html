<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Segurança: só carrega código deste site e só conversa com a API. Ao publicar, ajuste o connect-src (ver frontend/README.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
    <meta name="referrer" content="no-referrer">
    <title>Recuperar senha · AgendaSH</title>
    <meta name="description" content="AgendaSH: agendamento interno de reuniões e eventos da Software House (UNDB).">
    <meta name="theme-color" content="#07061a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-badge.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app auth" id="conteudo">
    <section class="auth-marca">
        <img class="auth-logo" src="img/logo-sh.webp" alt="Software House UNDB" width="320" height="314" fetchpriority="high">
        <h1 class="auth-nome">AgendaSH</h1>
        <p class="auth-casa">Software House</p>
        <p class="auth-frase">Esqueceu a senha? Mandamos um código para o seu e-mail institucional e você escolhe uma nova.</p>
    </section>

    <section class="auth-cartao" aria-labelledby="tituloRec">
        <ol class="passos" aria-hidden="true"><li class="feito"></li><li id="passo2"></li></ol>
        <h2 id="tituloRec" class="auth-titulo">Recuperar senha</h2>
        <p class="auth-sub" id="subRec">Informe o e-mail da sua conta.</p>
        <form id="formEsqueci" novalidate>
            <div class="campo ico ico-email"><label for="recEmail">E-mail</label><input type="email" id="recEmail" inputmode="email" autocomplete="email" maxlength="100" required></div>
            <button class="btn-pri" type="submit" id="btnPedir">Enviar código</button>
        </form>
        <form id="formRecuperar" hidden novalidate>
            <div class="campo ico ico-cod"><label for="recCodigo">Código recebido por e-mail</label><input type="text" id="recCodigo" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6 dígitos" required></div>
            <div class="campo ico ico-senha">
                <label for="recSenha">Senha nova</label>
                <div class="senha-wrap">
                    <input type="password" id="recSenha" autocomplete="new-password" placeholder="Mínimo 6 caracteres" minlength="6" maxlength="128" required>
                    <button type="button" class="ver-senha" aria-controls="recSenha" aria-label="Mostrar senha" aria-pressed="false">
                        <svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A10.5 10.5 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>
            </div>
            <div class="campo ico ico-senha">
                <label for="recConfirma">Confirmar senha nova</label>
                <div class="senha-wrap">
                    <input type="password" id="recConfirma" autocomplete="new-password" placeholder="Repita a senha" minlength="6" maxlength="128" required>
                    <button type="button" class="ver-senha" aria-controls="recConfirma" aria-label="Mostrar senha" aria-pressed="false">
                        <svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A10.5 10.5 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>
            </div>
            <button class="btn-pri" type="submit" id="btnRedefinir">Salvar senha</button>
            <button class="link-sm link-botao" type="button" id="linkReenviar">Reenviar código</button>
        </form>
        <p id="msgErro" class="msg" role="alert" aria-live="polite"></p>
        <p class="auth-rodape"><a href="login.html">Voltar ao login</a></p>
    </section>
</main>
<script src="src/core/api.js"></script>
<script src="src/modules/auth/services/auth.js"></script>
<script src="src/shared/cookies.js"></script>
<script src="src/shared/efeitos.js" defer></script>
</body>
</html>
