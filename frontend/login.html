<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login de Usuário</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel="stylesheet">
</head>

<body class="bodyLogin">

    <!--<img class="logoSh" src="logoSh.webp" alt="logoSh">-->

    <div class="cardLogin">
        <form id="formLogin" action="index.html" method="get">

            <h2>Entrar</h2>
            <div class="loginUsuario">
                <label>E-mail</label><br>
                <input type="text" id="loginUsuario" placeholder="Insira seu E-mail">
                <i class="bx bxs-user"></i>
            </div>
            <div class="loginSenha"> <label>Digite sua senha</label><br>
                <input type="password" id="loginSenha" placeholder="Informe sua senha">
                <i class="bx bxs-lock-alt"></i>
            </div>

        </form>
        <button type="submit" id="btnLogin">Login</button>
        <p id="msgErro" style="margin:0;color:#ffb3b3;font-family:sans-serif;font-size:medium"></p>

        <div class="criarElembrar">
            <p>Não tem conta? <br>
                <a href="cadastro.html">Cadastre-se aqui</a></p>
                <a href="esqueciSenha.html">Esqueci minha senha</a>

        </div>
    </div>
    <script src="src/core/api.js"></script>
    <script src="src/modules/auth/services/auth.js"></script>
</body>

</html>
