<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · AgendaSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <div class="logo"><img src="BOTTOM_SH.png" alt="" onerror="this.style.display='none'"><h1>Adendy</h1><span>Softwere house</span></div>
    <form id="formLogin" style="margin-top:36px" novalidate>
        <div class="campo"><label for="loginUsuario">E-mail</label><input type="email" id="loginUsuario" autocomplete="email" required></div>
        <div class="campo"><label for="loginSenha">Senha</label><input type="password" id="loginSenha" autocomplete="current-password" required></div>
        <a class="link" style="text-align:left;margin:-6px 0 6px 10px;font-size:.65rem" href="esqueciSenha.html">Recuperar senha</a>
        <button class="btn" type="submit" id="btnLogin">Entrar</button>
        <p id="msgErro" class="msg"></p>
    </form>
    <a class="link" href="cadastro.html">Ainda não tem conta? Criar conta</a>
</main>
<script src="src/core/api.js"></script>
<script src="src/modules/auth/services/auth.js"></script>
</body>
</html>
