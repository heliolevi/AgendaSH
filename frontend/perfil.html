<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Segurança: só carrega código deste site e só conversa com a API. Ao publicar, ajuste o connect-src (ver frontend/README.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
    <meta name="referrer" content="no-referrer">
    <title>Perfil · AgendaSH</title>
    <meta name="description" content="AgendaSH: agendamento interno de reuniões e eventos da Software House (UNDB).">
    <meta name="theme-color" content="#07061a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-badge.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app escuro" id="conteudo" tabindex="-1">
    <div class="estreita centro-bloco">
        <div class="perfil-cabeca">
            <div id="avatarGrande"></div>
            <h1 class="nome-grande" id="nome"></h1>
            <p class="nome-completo" id="papel"></p>
        </div>
        <section class="painel" aria-labelledby="tDados">
            <h2 class="painel-titulo" id="tDados">Informações pessoais</h2>
            <dl class="dados">
                <div><span id="icUser"></span><div><dt>Nome completo</dt><dd id="pNome"></dd></div></div>
                <div><span id="icEmail"></span><div><dt>E-mail institucional</dt><dd id="pEmail"></dd></div></div>
                <div><span id="icDesde"></span><div><dt>Membro desde</dt><dd id="pDesde">-</dd></div></div>
            </dl>
        </section>
        <section class="painel espaco-topo" aria-label="Ações da conta">
            <div class="acoes-lista" id="acoes">
                <button class="acao" id="btnEditar" type="button" aria-expanded="false" aria-controls="formPerfil"></button>
                <form id="formPerfil" class="form-perfil" hidden novalidate>
                    <div class="campo"><label for="eNome">Nome</label><input id="eNome" maxlength="100" autocomplete="name" required></div>
                    <div class="campo"><label for="eEmail">E-mail institucional</label><input id="eEmail" type="email" inputmode="email" maxlength="100" autocomplete="email" required>
                        <p class="dica">Só e-mails da UNDB (aluno: 002-02…@aluno.undb.edu.br · professor: nome@undb.edu.br).</p></div>
                    <p class="msg" id="msgErro" role="alert"></p>
                    <div class="form-acoes"><button class="btn-sec" type="button" id="btnCancelarEd">Cancelar</button><button class="btn-pri" type="submit" id="btnSalvar">Salvar</button></div>
                </form>
                <a class="acao" href="reunioesFixas.html" id="linkFixas"></a>
                <a class="acao" href="termos.html" id="linkTermos"></a>
                <button class="acao perigo" id="btnSair" type="button"></button>
            </div>
        </section>
    </div>
</main>
<script src="src/core/api.js"></script>
<script src="src/shared/icones.js"></script>
<script src="src/shared/app.js"></script>
<script src="src/modules/usuarios/pages/perfil.js"></script>
<script src="src/shared/cookies.js"></script>
<script src="src/shared/efeitos.js" defer></script>
</body>
</html>
