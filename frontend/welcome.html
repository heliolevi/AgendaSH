<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Segurança: só carrega código deste site e só conversa com a API. Ao publicar, ajuste o connect-src (ver frontend/README.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
    <meta name="referrer" content="no-referrer">
    <title>Bem-vindo · AgendaSH</title>
    <meta name="description" content="AgendaSH: agendamento interno de reuniões e eventos da Software House (UNDB).">
    <meta name="theme-color" content="#07061a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-badge.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app auth boas-vindas-tela" id="conteudo">
    <section class="auth-marca">
        <img class="auth-logo" src="img/logo-sh.webp" alt="Software House UNDB" width="320" height="314" fetchpriority="high">
        <h1 class="auth-nome">AgendaSH</h1>
        <p class="auth-casa">Software House</p>
        <p class="auth-frase">Reuniões e eventos da equipe marcados em segundos, com início, fim e sem conflito de sala.</p>
    </section>
    <section class="auth-cartao" aria-labelledby="tituloBv">
        <h2 id="tituloBv" class="auth-titulo">Bem-vindo</h2>
        <p class="auth-sub">Entre com seu e-mail institucional da UNDB ou crie sua conta.</p>
        <div class="auth-acoes">
            <a class="btn-pri" href="cadastro.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Criar conta</a>
            <a class="btn-sec" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M3 20c0-3.3 2.7-6 6-6s5 2 6 4"/><path d="M15 11l2 2 4-4"/></svg>Já tenho conta</a>
        </div>
        <p class="auth-rodape"><a href="termos.html">Termos &amp; Privacidade</a> · @softwarehouseundb</p>
    </section>
</main>
<script src="src/core/api.js"></script>
<script src="src/modules/auth/pages/welcome.js"></script>
<script src="src/shared/cookies.js"></script>
<script src="src/shared/efeitos.js" defer></script>
</body>
</html>
