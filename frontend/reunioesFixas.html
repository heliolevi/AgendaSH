<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Segurança: só carrega código deste site e só conversa com a API. Ao publicar, ajuste o connect-src (ver frontend/README.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
    <meta name="referrer" content="no-referrer">
    <title>Reuniões fixas · AgendaSH</title>
    <meta name="description" content="AgendaSH: agendamento interno de reuniões e eventos da Software House (UNDB).">
    <meta name="theme-color" content="#07061a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-badge.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app escuro" id="conteudo" tabindex="-1">
    <header class="topo">
        <div class="topo-texto">
            <h1 class="titulo">Reuniões fixas</h1>
            <p class="sub">Reuniões que se repetem toda semana no mesmo dia e horário. Elas entram no calendário das próximas semanas e se renovam sozinhas.</p>
        </div>
        <span id="avatar"></span>
    </header>

    <div class="grade-fixas">
        <section class="painel form-painel" aria-labelledby="tNovaFixa">
            <h2 class="painel-titulo" id="tNovaFixa">Nova reunião fixa</h2>
            <form class="form-agenda" id="formFixa" novalidate>
                <div class="campo">
                    <label for="titulo">Nome</label>
                    <input type="text" id="titulo" placeholder="Ex.: Daily da equipe" maxlength="200" required autocomplete="off">
                </div>
                <div class="campo">
                    <label for="dia">Dia da semana</label>
                    <select id="dia"></select>
                </div>
                <div class="linha-2">
                    <div class="campo"><label for="horaIni">Início</label><input type="time" id="horaIni" value="09:00" step="300" required></div>
                    <div class="campo"><label for="horaFim">Fim</label><input type="time" id="horaFim" value="10:00" step="300" required></div>
                </div>
                <div class="linha-2">
                    <div class="campo"><label for="dataIni">A partir de</label><input type="date" id="dataIni" required></div>
                    <div class="campo"><label for="dataFim">Até <span class="opcional">(opcional)</span></label><input type="date" id="dataFim"></div>
                </div>
                <fieldset class="espaco-topo">
                    <legend>Onde?</legend>
                    <div class="segmentos" id="segModo"></div>
                </fieldset>
                <div class="campo">
                    <label for="local" id="rotuloLocal">Link da reunião</label>
                    <input type="text" id="local" list="locais" maxlength="300" required autocomplete="off" aria-describedby="dicaLocal">
                    <datalist id="locais"></datalist>
                    <p class="dica" id="dicaLocal"></p>
                </div>
                <p class="dica" id="resumoFixa" aria-live="polite"></p>
                <p class="msg" id="msgErro" role="alert"></p>
                <div class="form-acoes"><button class="btn-pri" type="submit" id="btnSalvar">Criar reunião fixa</button></div>
            </form>
        </section>
        <section class="coluna" aria-labelledby="tMinhas">
            <div class="secao"><div><h2 id="tMinhas">Minhas reuniões fixas</h2><p>Cancelar uma série apaga as próximas reuniões dela.</p></div><a href="reunioes.html">Voltar à agenda</a></div>
            <div id="lista" class="lista"><div class="esqueleto" aria-hidden="true"><div class="esq-linha"></div><div class="esq-linha"></div></div></div>
        </section>
    </div>
</main>
<script src="src/core/api.js"></script>
<script src="src/shared/icones.js"></script>
<script src="src/shared/app.js"></script>
<script src="src/modules/reunioes/pages/fixas.js"></script>
<script src="src/shared/cookies.js"></script>
<script src="src/shared/efeitos.js" defer></script>
</body>
</html>
