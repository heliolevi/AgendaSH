<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Segurança: só carrega código deste site e só conversa com a API. Ao publicar, ajuste o connect-src (ver frontend/README.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
    <meta name="referrer" content="no-referrer">
    <title>Agenda · AgendaSH</title>
    <meta name="description" content="AgendaSH: agendamento interno de reuniões e eventos da Software House (UNDB).">
    <meta name="theme-color" content="#07061a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-badge.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app escuro" id="conteudo" tabindex="-1">
    <header class="topo">
        <div class="topo-texto">
            <h1 class="titulo">Agenda</h1>
            <p class="sub">Tudo o que vem pela frente, separado por dia.</p>
        </div>
        <span id="avatar"></span>
    </header>

    <div class="estreita">
        <div class="barra-filtros">
            <div class="segmentos" role="tablist" aria-label="Filtrar agenda" id="filtros">
                <button type="button" role="tab" aria-selected="true" data-filtro="todos">Tudo</button>
                <button type="button" role="tab" aria-selected="false" data-filtro="reuniao"><i class="ponto p-reuniao"></i>Reuniões</button>
                <button type="button" role="tab" aria-selected="false" data-filtro="evento"><i class="ponto p-evento"></i>Eventos</button>
            </div>
            <a class="link-pilula" href="reunioesFixas.html" id="linkFixas">Reuniões fixas</a>
        </div>
        <div id="lista" role="tabpanel" aria-live="polite"><div class="esqueleto" aria-hidden="true"><div class="esq-linha"></div><div class="esq-linha"></div><div class="esq-linha"></div></div></div>
    </div>
</main>
<script src="src/core/api.js"></script>
<script src="src/shared/icones.js"></script>
<script src="src/shared/app.js"></script>
<script src="src/modules/reunioes/pages/agenda.js"></script>
<script src="src/shared/cookies.js"></script>
<script src="src/shared/efeitos.js" defer></script>
</body>
</html>
